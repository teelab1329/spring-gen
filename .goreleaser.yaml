version: 2

project_name: spring-gen

before:
  hooks:
    - go mod tidy

builds:
  - id: spring-gen
    main: ./cmd/spring-gen
    binary: spring-gen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/teelab1329/spring-gen/internal/version.Version={{ .Version }}
      - -X github.com/teelab1329/spring-gen/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/teelab1329/spring-gen/internal/version.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    # No version in the asset name: the install scripts can then use
    # releases/latest/download without calling the GitHub API.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
