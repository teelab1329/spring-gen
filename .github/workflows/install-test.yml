name: Install test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install
        required: false

permissions:
  contents: read

jobs:
  install:
    name: install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/teelab1329/spring-gen/main/scripts/install.sh" \
            | sh -s -- ${VERSION:+--version "$VERSION"}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          $script = irm "https://raw.githubusercontent.com/teelab1329/spring-gen/main/scripts/install.ps1"
          if ($env:VERSION) {
            & ([scriptblock]::Create($script)) -Version $env:VERSION
          } else {
            & ([scriptblock]::Create($script))
          }
          "$env:LOCALAPPDATA\Programs\spring-gen" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify the installed binary
        shell: bash
        run: |
          spring-gen version
          spring-gen new demo --group com.acme --architecture layered --no-interactive
          test -f demo/pom.xml
          test -f demo/src/main/resources/application.yml
