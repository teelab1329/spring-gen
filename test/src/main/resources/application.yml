spring:
  application:
    name: test
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0

# HTTP request/response logging with OpenTelemetry-style fields.
# There is no trace exporter: ids only annotate this application's log lines.
app:
  http-logging:
    enabled: true
    max-body-size: 10KB
    masked-headers:
      - authorization
      - cookie
      - set-cookie
      - proxy-authorization
      - x-api-key
    exclude-paths:
      - /actuator/**
